name: Build and package APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Install Android NDK and CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "ndk;27.2.12479018" "cmake;3.22.1"
          test -f "$SDK/ndk/27.2.12479018/source.properties"

      - name: Static release security guardrails
        run: python tools/verify_release_security.py

      - name: Compose compiler regression guard
        run: python tools/verify_compose_compiler_regression.py

      - name: Unit tests (core logic)
        run: ./gradlew :core:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Wear OS debug APK
        run: ./gradlew :wear:assembleDebug --stacktrace

      - name: Prepare release signing (only when the repository secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release signing: configured"
          else
            echo "Release signing: secrets missing, the release APK stays unsigned"
          fi

      - name: Compile release APK (R8 minify + resource shrink; signed only with the release key)
        id: release_min
        continue-on-error: true
        run: ./gradlew :app:assembleRelease -Pminify --stacktrace

      - name: Fallback - release APK without R8 (only if the minified build failed)
        if: steps.release_min.outcome == 'failure'
        run: |
          echo "::warning::The R8-minified release build failed; building without minify. Check app/proguard-rules.pro."
          ./gradlew :app:assembleRelease --stacktrace

      - name: Publish APK and complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angolmagyar-build-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: |
            diagnostics/**
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            core/build/reports/tests/**
            wear/build/outputs/apk/debug/*.apk

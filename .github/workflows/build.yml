name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK telepítése (a runner beépített NDK-ja hiányos)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          rm -rf "$SDK/ndk/27.0.12077973" 2>/dev/null || sudo rm -rf "$SDK/ndk/27.0.12077973" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "ndk;27.2.12479018" "cmake;3.22.1" || \
            sudo -E "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "ndk;27.2.12479018" "cmake;3.22.1"
          ls "$SDK/ndk"
          test -f "$SDK/ndk/27.2.12479018/source.properties"
      - run: chmod +x gradlew
      - name: Unit tesztek (hiba nem akasztja meg az APK-t)
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: APK build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Hibák összefoglalója (a futás oldalának tetején látszik)
        if: failure()
        run: |
          {
            echo '### Fordítási hibák'
            echo '```'
            grep -E '^e: |error:|FAILED|Unresolved|What went wrong' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-es-hibariport
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
            app/build/reports/tests/**

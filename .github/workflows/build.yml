name: Build, test and package APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Install Android NDK and CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "ndk;27.2.12479018" "cmake;3.22.1"
          test -f "$SDK/ndk/27.2.12479018/source.properties"

      - name: Static release security guardrails
        run: python tools/verify_release_security.py

      - name: Core unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :core:test --stacktrace 2>&1 | tee core-test.log

      - name: Collect Core test diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics/core

          {
            echo "AngolMagyar Core test diagnostics"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Date UTC: $(date -u)"
            echo
            echo "=== TEST RESULT FILES ==="
            if [ -d core/build/test-results ]; then
              find core/build/test-results -type f -print
            else
              echo "Core test-results directory not found."
            fi
            echo
            echo "=== TEST REPORT FILES ==="
            if [ -d core/build/reports/tests ]; then
              find core/build/reports/tests -type f -print
            else
              echo "Core HTML reports directory not found."
            fi
            echo
            echo "=== FAILURE DETAILS ==="
            if [ -d core/build/test-results ]; then
              grep -R -n -E '<failure|<error' core/build/test-results || true
            fi
          } | tee diagnostics/core/summary.txt

          if [ -d core/build/test-results ]; then
            cp -a core/build/test-results diagnostics/core/
          fi

          if [ -d core/build/reports/tests ]; then
            cp -a core/build/reports/tests diagnostics/core/
          fi

          if [ -f core-test.log ]; then
            cp core-test.log diagnostics/core/
          fi

      - name: App unit tests (includes Compose screenshot smoke test)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Wear OS debug APK
        run: ./gradlew :wear:assembleDebug --stacktrace

      - name: Compile unsigned release APK (no debug-key fallback)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Publish APK and complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angolmagyar-build-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: |
            diagnostics/**
            core-test.log
            core/build/reports/tests/**
            core/build/test-results/**
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/roborazzi/**
            wear/build/outputs/apk/debug/*.apk

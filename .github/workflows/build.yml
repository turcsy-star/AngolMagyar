name: Build, test and package APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Install Android NDK and CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install "ndk;27.2.12479018" "cmake;3.22.1"
          test -f "$SDK/ndk/27.2.12479018/source.properties"

      - name: Static release security guardrails
        run: python tools/verify_release_security.py

      - name: Compose compiler regression guard
        run: python tools/verify_compose_compiler_regression.py

      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: App unit tests (includes Compose screenshot smoke test)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Wear OS debug APK
        run: ./gradlew :wear:assembleDebug --stacktrace

      - name: Compile unsigned release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare single-app APK download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/AngolMagyar-4.2.10.apk
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Publish APK only
        uses: actions/upload-artifact@v4
        with:
          name: AngolMagyar-4.2.10-APK
          path: dist/AngolMagyar-4.2.10.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
